[package]
name = "ark-dns"
version = "0.1.0"
edition = "2021"

[dependencies]
arc-swap = "1.7"
ark-core = { path = "../ark-core" }
ark-crypto = { version = "0.1.0", path = "../ark-crypto" }
ark-protocol = { version = "0.1.0", path = "../ark-protocol" }
ark-storage = { version = "0.1.0", path = "../ark-storage" }
ark-time = { version = "0.1.0", path = "../ark-time" }
bech32 = "0.11"
hex = "0.4"
prost = "0.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha3 = "0.10"
subtle = "2.5"
thiserror = "1.0"
tokio = { version = "1.39", features = ["macros", "net", "rt", "sync", "time"] }
tracing = "0.1"

[dev-dependencies]
rand = "0.8"
tempfile = "3.27"
tokio = { version = "1.39", features = ["macros", "rt-multi-thread"] }

[[bench]]
name = "trie_bench"
harness = false
