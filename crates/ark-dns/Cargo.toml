[package]
name = "ark-dns"
version = "0.1.0"
edition = "2021"

[dependencies]
arc-swap = "1.7"
ark-core = { path = "../ark-core" }
ark-crypto = { version = "0.1.0", path = "../ark-crypto" }
ark-protocol = { version = "0.1.0", path = "../ark-protocol" }
ark-storage = { version = "0.1.0", path = "../ark-storage" }
bech32 = "0.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha3 = "0.10"
thiserror = "1.0"

[dev-dependencies]
rand = "0.8"
tempfile = "3.27"

[[bench]]
name = "trie_bench"
harness = false
