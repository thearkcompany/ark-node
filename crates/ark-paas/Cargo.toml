[package]
name = "ark-paas"
version = "0.1.0"
edition = "2021"

[dependencies]
ark-core = { path = "../ark-core" }
ark-protocol = { path = "../ark-protocol" }
ark-storage = { path = "../ark-storage" }
wasmtime = "25.0.3"
dashmap = "6.2"
parking_lot = "0.12"
prost = "0.13"
prost-types = "0.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha3 = "0.10"
thiserror = "1.0"
tracing = "0.1"
tokio = { version = "1.38", features = ["sync", "time", "rt-multi-thread", "macros"], optional = true }

[build-dependencies]
prost-build = "0.13"
protoc-bin-vendored = "3.1"

[dev-dependencies]
tempfile = "3.27"
tokio = { version = "1.38", features = ["sync", "time", "rt-multi-thread", "macros"] }
wat = "1.221"

