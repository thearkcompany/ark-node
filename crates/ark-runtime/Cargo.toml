[package]
name = "ark-runtime"
version = "0.1.0"
edition = "2021"
authors = ["The ARK Company"]
description = "Unified NodeRuntime Daemon and Inbound Envelope Dispatcher for the ARK Sovereign P2P Network"

[dependencies]
ark-core = { path = "../ark-core" }
ark-crypto = { path = "../ark-crypto" }
ark-protocol = { path = "../ark-protocol" }
ark-transport = { path = "../ark-transport" }
ark-time = { path = "../ark-time" }
ark-storage = { path = "../ark-storage" }
ark-crdt = { path = "../ark-crdt" }
ark-blob = { path = "../ark-blob" }
ark-dns = { path = "../ark-dns" }
ark-vpn = { path = "../ark-vpn" }
ark-wot = { path = "../ark-wot" }
ark-paas = { path = "../ark-paas" }

tokio = { version = "1.39", features = ["full"] }
tokio-util = "0.7"
quinn = "0.11"
rustls = { version = "0.23", default-features = false, features = ["ring"] }
rcgen = "0.13.2"
tracing = "0.1"
thiserror = "1.0"
anyhow = "1.0"
parking_lot = "0.12"
prost = "0.13"
tempfile = "3.27"

[dev-dependencies]
tempfile = "3.27"
