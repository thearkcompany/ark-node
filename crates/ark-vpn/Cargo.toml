[package]
name = "ark-vpn"
version = "0.1.0"
edition = "2021"

[dependencies]
ark-core = { path = "../ark-core" }
ark-crypto = { path = "../ark-crypto" }
sha3 = "0.10"
thiserror = "1.0"
async-trait = "0.1"
tokio = { version = "1.39", features = ["sync", "rt"] }
tracing = "0.1"
libc = "0.2"

[dev-dependencies]
tokio = { version = "1.39", features = ["macros", "rt-multi-thread"] }
rand = "0.8"
rand_core = "0.6"
rand_chacha = "0.3"
