[package]
name = "ark-blob"
version = "0.1.0"
edition = "2021"

[dependencies]
ark-core = { path = "../ark-core" }
ark-protocol = { path = "../ark-protocol" }
ark-storage = { path = "../ark-storage" }
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
