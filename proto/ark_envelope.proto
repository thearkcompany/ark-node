syntax = "proto3";

package ark.protocol.v1;

// ArkEnvelope represents a canon transport container in ARK protocol v1
message ArkEnvelope {
  // Protocol magic identifier and versioning header
  bytes magic = 1;
  
  // Fast 64-byte L1-cache aligned header
  bytes fast_header = 2;
  
  // Cryptographic sender identity (derived ArkID via SHA3-256)
  bytes sender_id = 3;
  
  // Ephemeral recipient public key or key identifier
  bytes recipient_id = 4;
  
  // Encrypted payload (max 64 KB)
  bytes payload = 5;
  
  // Post-quantum signature (FN-DSA-512)
  bytes signature = 6;
  
  // Core tag mask and dynamic TLV binary tags
  uint64 core_tag_mask = 7;
  repeated BinaryTag tags = 8;
  
  // Epoch timestamp (milliseconds)
  uint64 timestamp = 9;
}

message BinaryTag {
  uint32 tag_type = 1;
  bytes tag_value = 2;
}

message ArkNodeStatus {
  string node_id = 1;
  string version = 2;
  uint64 uptime_seconds = 3;
  uint32 active_peers = 4;
  int64 peer_median_time = 5;
}

message MstSyncRequest {
  string namespace = 1;
  bytes root_hash = 2; // 32-byte SHA3-256 root digest
  repeated bytes requested_node_hashes = 3; // List of 32-byte node hashes
  bytes key_range_start = 4;
  bytes key_range_end = 5;
}

message MstSyncResponse {
  string namespace = 1;
  bytes root_hash = 2;
  repeated MstNodeWire nodes = 3;
  repeated ArkEnvelope missing_envelopes = 4;
}

message MstNodeWire {
  bytes node_hash = 1; // 32-byte SHA3-256 hash of this node
  uint32 level = 2;
  repeated MstEntryWire entries = 3;
  repeated bytes child_hashes = 4; // Subtree child hashes
}

message MstEntryWire {
  bytes key = 1;
  bytes envelope_id = 2; // 32-byte SHA3-256 envelope id
  uint64 timestamp = 3;
}

message DomainResolveResponse {
  bytes owner_key_id = 1;
  bytes target_peer_id = 2;
  repeated string routing_addrs = 3;
  uint64 expires_at = 4;
  bool in_grace_period = 5;
  bytes merkle_inclusion_proof = 6;
  uint64 epoch_timestamp = 7;
  bytes ech_public_key = 8;
}

message BlobShardDescriptor {
  uint32 shard_index = 1;
  bytes shard_hash = 2; // 32-byte SHA3-256 shard content hash
  bytes shard_root = 3; // 32-byte Tier 2 Merkle root
  uint64 shard_size = 4; // Standard 1 MB (1048576 bytes)
}

message ArkBlobManifest {
  bytes blob_cid = 1; // 32-byte Tier 1 Merkle root
  uint64 total_size = 2; // Original pre-coding unpadded payload length
  uint32 data_shards = 3; // Canonical: 10
  uint32 parity_shards = 4; // Canonical: 4
  repeated bytes shard_hashes = 5; // 14 SHA3-256 hashes
  repeated bytes shard_roots = 6; // 14 Tier 2 Merkle roots
  repeated BlobShardDescriptor shards = 7;
  uint64 created_at = 8; // Seconds since UNIX epoch
  bytes escrow_contract = 9; // L2 contract ID / sponsorship proof (TAG_L2_CONTRACT)
}

message DepinPorChallenge {
  bytes blob_cid = 1; // 32-byte BlobCID
  uint32 shard_index = 2; // Shard index 0..13
  uint32 sub_block_index = 3; // 4 KB sub-block index 0..255
  bytes challenge_seed = 4; // 32-byte challenge seed
}

message DepinPorResponse {
  bytes blob_cid = 1; // 32-byte BlobCID
  uint32 shard_index = 2; // Shard index 0..13
  uint32 sub_block_index = 3; // 4 KB sub-block index 0..255
  bytes sub_block_payload = 4; // 4 KB sub-block raw bytes
  bytes kmac_digest = 5; // 32-byte KMAC256(seed, sub_block)
  bytes merkle_proof_bytes = 6; // Binary serialized ShardMerkleProof
}

